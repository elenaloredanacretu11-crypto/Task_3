name: Tests and scheduled pipeline
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
jobs:
  test-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
      - run: python pipeline.py
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-output
          path: |
            output/processed_shipments.csv
            output/pipeline_summary.json
